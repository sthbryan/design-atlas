name: urls

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: urls
        continue-on-error: true
        run: node scripts/check-urls.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add url-health.json
          git diff --staged --quiet || git commit -m "chore(atlas): refresh url health"
          git push
      - if: steps.urls.outcome == 'failure'
        run: |
          echo "Pages moved or stopped answering; read url-health.json, re-check the pages and update their url or status."
          exit 1
