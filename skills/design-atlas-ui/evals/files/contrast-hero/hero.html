<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fieldnote</title>
  <style>
    body { margin: 0; background: #FFFFFF; font-family: system-ui, sans-serif; }
    .hero { max-width: 720px; margin: 0 auto; padding: 96px 24px; }
    .badge { color: #7C8490; font-size: 16px; font-weight: 700; }
    .kicker { color: #7C8490; font-size: 19px; font-weight: 700; }
    h1 { color: #111111; font-size: 48px; font-weight: 700; line-height: 1.1; margin: 8px 0; }
    .sub { color: #8A8F98; font-size: 20px; font-weight: 400; }
    .note { color: #707782; font-size: 22px; font-weight: 400; }
    .cta { background: #6366F1; color: #FFFFFF; font-size: 16px; font-weight: 600; padding: 12px 20px; border-radius: 8px; text-decoration: none; display: inline-block; }
  </style>
</head>
<body>
  <section class="hero">
    <div class="badge">Beta</div>
    <div class="kicker">Field notes for ecologists</div>
    <h1>Record a transect in half the time</h1>
    <p class="sub">Log species, counts and GPS points offline, then sync when you are back in range.</p>
    <p class="note">Works on any phone from the last five years.</p>
    <a class="cta" href="/signup">Start a survey</a>
  </section>
</body>
</html>
