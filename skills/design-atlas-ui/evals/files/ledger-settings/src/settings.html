<!doctype html>
<html>
<head>

  <title>Settings · Ledger</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="page">

      <div class="card-title">Profile</div>

    </div>
    <div class="card">
      <div class="card-title">Danger zone</div>
      <div class="btn btn-danger" onclick="del()">Delete</div>
    </div>
  </div>
